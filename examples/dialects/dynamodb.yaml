# dynamodb dialect example — reference pattern: high-volume customer_events kept separate from CRM core tables.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'DynamoDB tables demonstrating the reference migration pattern.'

Resources:
  Table1:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'Customers'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CustomerId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CustomerId'
          KeyType: 'HASH'
  Table2:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'CustomerProfiles'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CustomerId'
          AttributeType: 'S'
        - AttributeName: 'ProfileId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CustomerId'
          KeyType: 'HASH'
        - AttributeName: 'ProfileId'
          KeyType: 'RANGE'
  Table3:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'Subscriptions'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CustomerId'
          AttributeType: 'S'
        - AttributeName: 'SubscriptionId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CustomerId'
          KeyType: 'HASH'
        - AttributeName: 'SubscriptionId'
          KeyType: 'RANGE'
  Table4:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'PaymentMethods'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CustomerId'
          AttributeType: 'S'
        - AttributeName: 'PaymentMethodId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CustomerId'
          KeyType: 'HASH'
        - AttributeName: 'PaymentMethodId'
          KeyType: 'RANGE'
  Table5:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'CustomerEvents'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CustomerId'
          AttributeType: 'S'
        - AttributeName: 'EventId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CustomerId'
          KeyType: 'HASH'
        - AttributeName: 'EventId'
          KeyType: 'RANGE'
  Table6:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'SupportTickets'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CustomerId'
          AttributeType: 'S'
        - AttributeName: 'TicketId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CustomerId'
          KeyType: 'HASH'
        - AttributeName: 'TicketId'
          KeyType: 'RANGE'
