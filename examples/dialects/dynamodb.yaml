# dynamodb dialect example — subset pattern: product catalog with recent reviews embedded and full review history elsewhere.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'DynamoDB tables demonstrating the subset migration pattern.'

Resources:
  Table1:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'Brands'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'BrandId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'BrandId'
          KeyType: 'HASH'
  Table2:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'Categories'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'CategoryId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'CategoryId'
          KeyType: 'HASH'
  Table3:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'Products'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'ProductId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'ProductId'
          KeyType: 'HASH'
  Table4:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'ProductImages'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'ImageId'
          AttributeType: 'S'
        - AttributeName: 'ProductId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'ImageId'
          KeyType: 'HASH'
        - AttributeName: 'ProductId'
          KeyType: 'RANGE'
  Table5:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'Reviews'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'ReviewId'
          AttributeType: 'S'
        - AttributeName: 'ProductId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'ReviewId'
          KeyType: 'HASH'
        - AttributeName: 'ProductId'
          KeyType: 'RANGE'
  Table6:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'ReviewVotes'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'VoteId'
          AttributeType: 'S'
        - AttributeName: 'ReviewId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'VoteId'
          KeyType: 'HASH'
        - AttributeName: 'ReviewId'
          KeyType: 'RANGE'
