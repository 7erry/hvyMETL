AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Single-Table DynamoDB Implementation for an Enterprise Content Management System (CMS).
  Supports editorial workflows, i18n localization, taxonomy tagging, threaded comments, and digital asset management.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - dev
      - staging
      - production
    Description: Target deployment environment.

Resources:
  CmsPlatformTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'cms-platform-${Environment}'
      BillingMode: PAY_PER_REQUEST
      
      # Security & Resilience Settings
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      
      # Streams for search indexing (OpenSearch), cache invalidation (CloudFront), and static site generation triggers
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      # Auto-expiration for scheduled preview links, transient draft tokens, or ephemeral cache locks
      TimeToLiveSpecification:
        AttributeName: ExpireAt
        Enabled: true

      # Attribute Definitions (Only schema-defined keys for primary & global secondary indexes)
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S

      # Main Table Primary Key Schema
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      # Global Secondary Indexes
      GlobalSecondaryIndexes:
        # GSI 1: Content Publishing Feeds & Taxonomy Lists
        # Pattern: Query published content by locale & status ordered by publish date; query articles by category/tag
        - IndexName: GSI1-PublishFeed-Taxonomy-Index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI 2: Author Dashboards & Editorial Moderation Queue
        # Pattern: Fetch drafts/articles by Author OR query comments awaiting moderation (`MOD#PENDING`) ordered by date
        - IndexName: GSI2-Author-Moderation-Index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - ContentId
              - Title
              - AuthorId
              - Status
              - CommentText
              - UserHandle
              - UpdatedAt

        # GSI 3: Fast Slug Resolution & Asset Catalog Routing
        # Pattern: Fetch content ID by SEO URL Slug or query digital assets by media type (IMAGE, VIDEO, PDF)
        - IndexName: GSI3-Slug-Asset-Index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY

      Tags:
        - Key: Application
          Value: CMSPlatform
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TableName:
    Description: Name of the CMS DynamoDB Table
    Value: !Ref CmsPlatformTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  TableArn:
    Description: ARN of the CMS DynamoDB Table
    Value: !GetAtt CmsPlatformTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'

  TableStreamArn:
    Description: ARN of the Stream for EventBridge / OpenSearch / SSG triggers
    Value: !GetAtt CmsPlatformTable.StreamArn
    Export:
      Name: !Sub '${AWS::StackName}-StreamArn'
